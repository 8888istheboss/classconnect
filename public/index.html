<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="ClassConnect : l’espace de classe pour apprendre, discuter et jouer ensemble.">
<title>ClassConnect · Espace de classe</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#162033;--muted:#667085;--line:#e5eaf2;--brand:#315ee8;--brand-soft:#edf2ff;--good:#16865c;--bad:#c9364f;--shadow:0 12px 32px #1b2d4d0b;font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1220;--panel:#131c2d;--text:#edf2fc;--muted:#a0aec3;--line:#28354a;--brand:#83a0ff;--brand-soft:#202d4a;--good:#56d7a5;--bad:#ff8795;--shadow:0 12px 32px #0003}}
*{box-sizing:border-box}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:inherit}
button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 12px}
button{font-weight:650;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
button:hover{border-color:var(--brand)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 28%,transparent);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}
.p,.on{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
.app-shell{max-width:1320px;min-height:100vh;margin:auto;padding:20px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 22px}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);font-size:1.25rem;font-weight:800;letter-spacing:-.04em;text-decoration:none}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--brand);color:white}
.brand-caption{display:block;color:var(--muted);font-size:.72rem;font-weight:500;letter-spacing:.02em}
.account-area{display:flex;align-items:center;gap:8px}
.account-area #me{width:150px}
.role-badge{border-radius:999px;background:var(--brand-soft);color:var(--brand);padding:6px 10px;font-size:.78rem;font-weight:700}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start;gap:22px}
.sidebar{position:sticky;top:16px;display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.sidebar button{width:100%;border:0;background:transparent;text-align:left;padding:10px 12px}
.sidebar button:hover{background:var(--bg)}
.sidebar button.on{background:var(--brand)!important}
.workspace{min-width:0}
h2{margin:0 0 10px;font-size:1.08rem;letter-spacing:-.02em}
.card{margin-bottom:14px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:10px 0}
.row input,.row textarea{flex:1;min-width:130px}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.mu{color:var(--muted);font-size:.875rem}
.big{font-size:1.25rem;font-weight:800;letter-spacing:-.025em}
.x{padding:5px 9px;font-size:.82rem}
.bar{display:flex;flex-wrap:wrap;gap:6px}
.bar button{padding:7px 10px}
.field-label{display:block;margin:7px 0 5px;text-align:left;font-size:.86rem;font-weight:650}
.notice{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;background:var(--brand-soft)}
.auth-card{max-width:440px;margin:clamp(24px,8vh,76px) auto;text-align:center;padding:clamp(20px,5vw,34px)}
.auth-logo{margin-top:6px;font-size:1.8rem}
.auth-switch{justify-content:center;margin:18px 0}
.auth-switch button{min-width:120px}
#ml{height:48vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{display:flex;align-items:flex-start;gap:8px}
.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;font-size:1.1rem}
.bub{max-width:100%;padding:7px 11px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.bub.mine{background:var(--brand-soft)}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.acts button{padding:2px 7px;font-size:.78rem;font-weight:500}
.pin{margin-bottom:6px;padding:7px 10px;border-radius:10px;background:var(--brand-soft);font-size:.9rem}
b.me{border-radius:4px;background:#ffe28a;color:#222;padding:0 3px}
.fc{display:flex;min-height:110px;align-items:center;justify-content:center;margin:8px 0;padding:14px;border:2px dashed var(--line);border-radius:12px;text-align:center;font-size:1.15rem;font-weight:700;cursor:pointer}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left}
.good{background:var(--good)!important;border-color:var(--good)!important;color:#fff!important}
.bad{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.pb{height:8px;margin-top:4px;border-radius:6px;background:var(--brand)}
.done{text-decoration:line-through;color:var(--muted)}
.game-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.game-stat{padding:10px;border-radius:12px;background:var(--bg)}
.game-option{width:100%;padding:12px 14px;text-align:left}
.tms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.tm{padding:8px;border:1px solid var(--line);border-left-width:4px;border-radius:10px}
.status-line{padding:12px 0;color:var(--muted);font-size:.82rem}
#toast{position:fixed;z-index:20;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;max-width:min(440px,calc(100vw - 32px));padding:11px 15px;border-radius:12px;background:var(--text);color:var(--bg);box-shadow:var(--shadow)}
.skip-link{position:absolute;top:-100px;left:12px;z-index:30;padding:10px;background:var(--panel);color:var(--text)}
.skip-link:focus{top:12px}
@media(max-width:760px){.app-shell{padding:12px}.topbar{align-items:flex-start;flex-direction:column;padding-bottom:14px}.account-area{width:100%;flex-wrap:wrap}.layout{grid-template-columns:1fr;gap:10px}.sidebar{position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:7px}.sidebar button{width:auto;flex:none;white-space:nowrap}.workspace{width:100%}.game-stats{grid-template-columns:1fr 1fr}.card{padding:14px}}
@media(max-width:440px){.account-area #me{flex:1;width:auto}.account-area button{font-size:.82rem}.role-badge{order:3}.it{align-items:flex-start}.it>span:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#v">Aller au contenu</a>
<main class="app-shell">
<header class="topbar">
<a class="brand" href="#" onclick="go('acc');return false"><span class="brand-mark" aria-hidden="true">C</span><span>ClassConnect<span class="brand-caption">L’espace de classe</span></span></a>
<div class="account-area"><span id="role" class="role-badge">CONNEXION</span><input id="me" aria-label="Pseudo affiché" placeholder="Ton pseudo" maxlength="20"><button onclick="logout()" title="Déconnexion de la classe">Quitter</button></div>
</header>
<div class="layout">
<nav class="sidebar" id="tabs" aria-label="Navigation principale"></nav>
<section class="workspace"><div id="bn" aria-live="polite"></div><div id="v" aria-live="polite"></div><p class="status-line" id="st"></p></section>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/shim.js"></script>
<script src="/app.js"></script>
<script src="/patch.js"></script>
</body>
</html>
